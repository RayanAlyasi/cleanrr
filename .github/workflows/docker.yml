name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: cleanrr:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cleanrr:pr
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Import the package inside the image
        # -w / forces the import against site-packages: /app holds the copied source tree, and python -c prepends the working directory to sys.path, so running from /app would import the source copy and pass even if the install had failed.
        run: docker run --rm -w / cleanrr:pr python -c "import cleanrr, cleanrr.bot"
