[project]
name = "cleanrr"
dynamic = ["version"]
description = "Telegram bot for self-service homelab media management (Sonarr / Radarr / Overseerr / qBittorrent)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[ext]>=22.7,<23",
    "pydantic-settings>=2.14,<3",
    "claude-agent-sdk>=0.2.82,<0.3",
    "aiosqlite>=0.20,<0.23",
    "prometheus-client>=0.21,<0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.4",
    "pyright>=1.1.391",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "bandit>=1.8",
    "pre-commit>=4.0.1",
]

[project.scripts]
cleanrr = "cleanrr.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["cleanrr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate (commented-out code)
    "RET", # flake8-return
    "PIE", # flake8-pie
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# python-telegram-bot handlers have a framework-mandated signature
# (`update`, `context`); `context` is often unused.
"cleanrr/handlers.py" = ["ARG001"]

[tool.pyright]
include = ["cleanrr", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# False positive: fires on private helpers (e.g. tools/_status_label.py) that
# are genuinely used, just from sibling modules in the same package rather
# than the declaring file itself — pyright's usage analysis doesn't see it.
reportUnusedFunction = "none"
# claude_agent_sdk's own @tool decorator returns SdkMcpTool[Unknown] — the
# type parameter is never concrete anywhere in the SDK's own public API, so
# every legitimate use of a built tool list (agent.py, every tools/*.py
# factory) inherits Unknown. Verified this isn't cleanrr's own code leaving
# things untyped: it fires identically in production code and tests, always
# traced to the same claude_agent_sdk generic, never to a cleanrr-authored
# type. Confirmed the same for cross-module private-helper imports
# (reportPrivateUsage) — a deliberate cleanrr/tools/ convention (shared
# internal helpers, e.g. _format_status_label, _resolve_user_id), not a
# leaked-encapsulation bug.
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingTypeArgument = "none"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
# tests/ share a **overrides: object fixture pattern whose dict.update()
# call strict mode can't cleanly resolve overload-wise, and construct
# ad-hoc literal fixture dicts whose shapes vary across test functions in
# the same file, confusing strict inference on plain "in" checks. Verified
# each instance by hand — none are real bugs, all are test-data-shape
# artifacts. Production code has neither pattern and needs no override here.
reportCallIssue = "none"
reportArgumentType = "none"
reportOperatorIssue = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["cleanrr"]
omit = ["cleanrr/__main__.py", "cleanrr/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]
